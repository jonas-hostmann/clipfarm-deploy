# ClipFarm – Docker Compose Stack (VPS-Only)
# Coolify-kompatibel | Upload/Publishing läuft auf separatem Mac Mini
# Domains: Traefik-Labels für automatische HTTPS via Coolify

services:
  # ─────────────────────────────────────────────
  # SUPOCLIP – KI Clip-Engine
  # Web UI:     clipfarm.hostmann-media.de
  # API:        clipfarm.hostmann-media.de/api
  # ─────────────────────────────────────────────
  supoclip:
    image: ghcr.io/fujiwara/supoclip:latest
    container_name: clipfarm_supoclip
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/supoclip
      - REDIS_URL=redis://redis:6379/0
      - ASSEMBLY_AI_API_KEY=${ASSEMBLY_AI_API_KEY:-}
      - LLM=${LLM:-google-gla:gemini-1.5-flash}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - clipfarm_data:/app/data
      - ./config:/app/config:ro
    depends_on:
      - postgres
      - redis
    networks:
      - clipfarm
    labels:
      - traefik.enable=true
      - traefik.http.routers.supoclip.rule=Host(`clipfarm.hostmann-media.de`)
      - traefik.http.routers.supoclip.entrypoints=https
      - traefik.http.routers.supoclip.tls.certresolver=letsencrypt
      - traefik.http.services.supoclip.loadbalancer.server.port=3000

  # ─────────────────────────────────────────────
  # POSTGRESQL – Metadaten & Queue
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clipfarm_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=supoclip
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - clipfarm

  # ─────────────────────────────────────────────
  # REDIS – Job-Queue & Caching
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: clipfarm_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - clipfarm

  # ─────────────────────────────────────────────
  # MINIO – S3-kompatibler Storage
  # Console:    storage.clipfarm.hostmann-media.de
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: clipfarm_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - clipfarm
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio.rule=Host(`storage.clipfarm.hostmann-media.de`)
      - traefik.http.routers.minio.entrypoints=https
      - traefik.http.routers.minio.tls.certresolver=letsencrypt
      - traefik.http.services.minio.loadbalancer.server.port=9001

  # ─────────────────────────────────────────────
  # N8N – Workflow Automation
  # UI:         n8n.clipfarm.hostmann-media.de
  # ─────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: clipfarm_n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST:-n8n.clipfarm.hostmann-media.de}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST:-n8n.clipfarm.hostmann-media.de}/
      - GENERIC_TIMEZONE=Europe/Berlin
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_PUBLIC_API_DISABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/backup/workflows:ro
    depends_on:
      - postgres
    networks:
      - clipfarm
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.clipfarm.hostmann-media.de`)
      - traefik.http.routers.n8n.entrypoints=https
      - traefik.http.routers.n8n.tls.certresolver=letsencrypt
      - traefik.http.services.n8n.loadbalancer.server.port=5678

  # ─────────────────────────────────────────────
  # DASHBOARD – Monitoring & Übersicht
  # UI:         dashboard.clipfarm.hostmann-media.de
  # ─────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: clipfarm_dashboard
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/supoclip
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - COOLIFY_URL=${COOLIFY_URL:-https://coolify.hostmann-media.de}
      - COOLIFY_TOKEN=${COOLIFY_TOKEN:-}
      - SUPOCLIP_APP_UUID=${SUPOCLIP_APP_UUID:-}
    depends_on:
      - postgres
      - minio
    networks:
      - clipfarm
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`dashboard.clipfarm.hostmann-media.de`)
      - traefik.http.routers.dashboard.entrypoints=https
      - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
      - traefik.http.services.dashboard.loadbalancer.server.port=8080

  # ─────────────────────────────────────────────
  # OLLAMA – Lokale KI (Optional, für Offline-LLM)
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: clipfarm_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - clipfarm

# ─────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────
volumes:
  clipfarm_data:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:
  ollama_data:

# ─────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────
networks:
  clipfarm:
    driver: bridge
