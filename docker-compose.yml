# ClipFarm – Docker Compose Stack (VPS-Only)
# Coolify-kompatibel | Upload/Publishing läuft auf separatem Mac Mini
# SupoClip wird aus dem offiziellen Repo gebaut (kein fertiges Image verfügbar)

services:
  # ─────────────────────────────────────────────
  # SUPOCLIP BACKEND – KI Clip-Engine API (FastAPI)
  # API:        api.clipfarm.hostmann-media.de
  # ─────────────────────────────────────────────
  supoclip:
    build:
      context: https://github.com/FujiwaraChoki/supoclip.git#main:backend
      dockerfile: Dockerfile
    container_name: clipfarm_supoclip
    restart: unless-stopped
    platform: linux/amd64
    command: [".venv/bin/uvicorn", "src.main_refactored:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/supoclip
      - TEMP_DIR=/app/uploads
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - ASSEMBLY_AI_API_KEY=${ASSEMBLY_AI_API_KEY:-}
      - LLM=${LLM:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - YOUTUBE_DATA_API_KEY=${YOUTUBE_API_KEY:-}
      - SELF_HOST=true
      - BACKEND_AUTH_SECRET=${BACKEND_AUTH_SECRET}
      - APP_SETTINGS_ENCRYPTION_KEY=${APP_SETTINGS_ENCRYPTION_KEY}
      - CORS_ORIGINS=https://clipfarm.hostmann-media.de,https://dashboard.clipfarm.hostmann-media.de
      - NEXT_PUBLIC_APP_URL=https://clipfarm.hostmann-media.de
    volumes:
      - clipfarm_uploads:/app/uploads
      - clipfarm_clips:/app/clips
    depends_on:
      - postgres
      - redis
    networks:
      - clipfarm
    labels:
      - traefik.enable=true
      - traefik.http.routers.supoclip-api.rule=Host(`api.clipfarm.hostmann-media.de`)
      - traefik.http.routers.supoclip-api.entrypoints=https
      - traefik.http.routers.supoclip-api.tls.certresolver=letsencrypt
      - traefik.http.services.supoclip-api.loadbalancer.server.port=8000

  # ─────────────────────────────────────────────
  # SUPOCLIP FRONTEND – Web UI (Next.js)
  # Web UI:     clipfarm.hostmann-media.de
  # ─────────────────────────────────────────────
  supoclip-frontend:
    build:
      context: https://github.com/FujiwaraChoki/supoclip.git#main:frontend
      dockerfile: Dockerfile
      target: development
    container_name: clipfarm_supoclip_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=https://api.clipfarm.hostmann-media.de
      - BACKEND_INTERNAL_URL=http://supoclip:8000
      - NEXT_PUBLIC_SELF_HOST=true
      - NEXT_PUBLIC_APP_URL=https://clipfarm.hostmann-media.de
      - BACKEND_AUTH_SECRET=${BACKEND_AUTH_SECRET}
      - APP_SETTINGS_ENCRYPTION_KEY=${APP_SETTINGS_ENCRYPTION_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/supoclip
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://clipfarm.hostmann-media.de
    depends_on:
      - postgres
      - supoclip
    networks:
      - clipfarm
    labels:
      - traefik.enable=true
      - traefik.http.routers.supoclip.rule=Host(`clipfarm.hostmann-media.de`)
      - traefik.http.routers.supoclip.entrypoints=https
      - traefik.http.routers.supoclip.tls.certresolver=letsencrypt
      - traefik.http.services.supoclip.loadbalancer.server.port=3107

  # ─────────────────────────────────────────────
  # SUPOCLIP WORKER – Hintergrund-Verarbeitung
  # ─────────────────────────────────────────────
  supoclip-worker:
    build:
      context: https://github.com/FujiwaraChoki/supoclip.git#main:backend
      dockerfile: Dockerfile
    container_name: clipfarm_supoclip_worker
    restart: unless-stopped
    platform: linux/amd64
    command: [".venv/bin/arq", "src.workers.tasks.WorkerSettings"]
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/supoclip
      - TEMP_DIR=/app/uploads
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - ASSEMBLY_AI_API_KEY=${ASSEMBLY_AI_API_KEY:-}
      - LLM=${LLM:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - YOUTUBE_DATA_API_KEY=${YOUTUBE_API_KEY:-}
      - SELF_HOST=true
      - BACKEND_AUTH_SECRET=${BACKEND_AUTH_SECRET}
      - APP_SETTINGS_ENCRYPTION_KEY=${APP_SETTINGS_ENCRYPTION_KEY}
      - CORS_ORIGINS=https://clipfarm.hostmann-media.de
      - NEXT_PUBLIC_APP_URL=https://clipfarm.hostmann-media.de
    volumes:
      - clipfarm_uploads:/app/uploads
      - clipfarm_clips:/app/clips
    depends_on:
      - postgres
      - redis
      - supoclip
    networks:
      - clipfarm

  # ─────────────────────────────────────────────
  # POSTGRESQL – Metadaten & Queue
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clipfarm_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=supoclip
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./config/supoclip_init.sql:/docker-entrypoint-initdb.d/02-supoclip.sql:ro
    networks:
      - clipfarm

  # ─────────────────────────────────────────────
  # REDIS – Job-Queue & Caching
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: clipfarm_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - clipfarm

  # ─────────────────────────────────────────────
  # MINIO – S3-kompatibler Storage
  # Console:    storage.clipfarm.hostmann-media.de
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: clipfarm_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - clipfarm
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio.rule=Host(`storage.clipfarm.hostmann-media.de`)
      - traefik.http.routers.minio.entrypoints=https
      - traefik.http.routers.minio.tls.certresolver=letsencrypt
      - traefik.http.services.minio.loadbalancer.server.port=9001

  # ─────────────────────────────────────────────
  # N8N – Workflow Automation
  # UI:         n8n.clipfarm.hostmann-media.de
  # ─────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: clipfarm_n8n
    restart: unless-stopped
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST:-n8n.clipfarm.hostmann-media.de}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST:-n8n.clipfarm.hostmann-media.de}/
      - GENERIC_TIMEZONE=Europe/Berlin
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/backup/workflows:ro
    depends_on:
      - postgres
    networks:
      - clipfarm
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.clipfarm.hostmann-media.de`)
      - traefik.http.routers.n8n.entrypoints=https
      - traefik.http.routers.n8n.tls.certresolver=letsencrypt
      - traefik.http.services.n8n.loadbalancer.server.port=5678

  # ─────────────────────────────────────────────
  # DASHBOARD – Monitoring & Übersicht
  # UI:         dashboard.clipfarm.hostmann-media.de
  # ─────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: clipfarm_dashboard
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/supoclip
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - COOLIFY_URL=${COOLIFY_URL:-https://coolify.hostmann-media.de}
      - COOLIFY_TOKEN=${COOLIFY_TOKEN:-}
      - SUPOCLIP_APP_UUID=${SUPOCLIP_APP_UUID:-}
    depends_on:
      - postgres
      - minio
    networks:
      - clipfarm
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`dashboard.clipfarm.hostmann-media.de`)
      - traefik.http.routers.dashboard.entrypoints=https
      - traefik.http.routers.dashboard.tls.certresolver=letsencrypt
      - traefik.http.services.dashboard.loadbalancer.server.port=8080

  # ─────────────────────────────────────────────
  # OLLAMA – Lokale KI (Optional, für Offline-LLM)
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: clipfarm_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - clipfarm

# ─────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────
volumes:
  clipfarm_uploads:
  clipfarm_clips:
  postgres_data:
  redis_data:
  minio_data:
  n8n_data:
  ollama_data:

# ─────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────
networks:
  clipfarm:
    driver: bridge
